version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: oauth2-server
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs
      - ./web:/app/web
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: oauth2-adminer
    ports:
      - "8081:8080"
